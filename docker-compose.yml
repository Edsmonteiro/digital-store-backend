services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: digital_store
      MYSQL_USER: digital_store
      MYSQL_PASSWORD: local_dev_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - digital_store_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -plocal_root_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  digital_store_mysql:
